# ═══════════════════════════════════════════════════════════════════
#  🐍 Snake Contribution Animation Generator
# ═══════════════════════════════════════════════════════════════════
#  This workflow generates the animated snake SVG that eats your
#  GitHub contribution graph. It runs automatically every 12 hours
#  and can also be triggered manually from the Actions tab.
#
#  The generated SVGs are pushed to the 'output' branch and
#  referenced in the README.md.
#
#  ⚠️  SETUP: Go to your repo → Settings → Actions → General →
#      Under "Workflow permissions", select "Read and write permissions"
# ═══════════════════════════════════════════════════════════════════

name: Generate Snake Animation

on:
  # Runs every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

  # Also runs on push to main (generates on first setup)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          # ── Edit your GitHub username below ──
          github_user_name: Muhammad-UmarX

          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=DC143C&color_dots=#0d1117,#1a0a0a,#3d0000,#8B0000,#DC143C
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
