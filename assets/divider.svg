<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="100%" preserveAspectRatio="none">
  <defs>
    <filter id="g" x="-50%" y="-200%" width="200%" height="600%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-50%" y="-200%" width="200%" height="600%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC143C" stop-opacity="0"/>
      <stop offset="12%" stop-color="#DC143C" stop-opacity="1"/>
      <stop offset="88%" stop-color="#DC143C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8888" stop-opacity="0"/>
      <stop offset="12%" stop-color="#FF8888" stop-opacity="1"/>
      <stop offset="88%" stop-color="#FF8888" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF8888" stop-opacity="0"/>
    </linearGradient>
    <path id="bolt" d="M0,10 L55,10 L63,4 L71,16 L79,5 L87,15 L95,7 L103,10 L195,10 L203,4 L211,16 L219,5 L227,15 L235,7 L243,10 L375,10 L383,4 L391,16 L399,5 L407,15 L415,7 L423,10 L555,10 L563,4 L571,16 L579,5 L587,15 L595,7 L603,10 L695,10 L703,4 L711,16 L719,5 L727,15 L735,7 L743,10 L875,10 L883,4 L891,16 L899,5 L907,15 L915,7 L923,10 L1055,10 L1063,4 L1071,16 L1079,5 L1087,15 L1095,7 L1103,10 L1200,10" fill="none"/>
  </defs>
  <style>
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .bolt{animation:pulse 2.5s ease-in-out infinite}
  </style>
  <g class="bolt">
    <use href="#bolt" stroke="url(#fade)" stroke-width="6" opacity=".25" filter="url(#g2)"/>
    <use href="#bolt" stroke="url(#fade)" stroke-width="2" filter="url(#g)"/>
    <use href="#bolt" stroke="url(#fade2)" stroke-width=".5" opacity=".7"/>
  </g>
</svg>
